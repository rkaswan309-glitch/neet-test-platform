<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720;
    --panel:#16212c;
    --panel-2:#1c2a37;
    --accent:#3ddc84;
    --accent-dim:#1f8f56;
    --text:#eef3f6;
    --text-dim:#9fb0bc;
    --border:#26343f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,.mono{ font-family:'Space Grotesk',sans-serif; }
  .wrap{
    max-width:760px;
    margin:0 auto;
    padding:40px 18px 60px;
  }
  header{ margin-bottom:34px; }
  header h1{ font-size:1.7rem; margin:0 0 6px; letter-spacing:-0.01em; }
  header p{ color:var(--text-dim); margin:0; font-size:.95rem; }

  .testcard{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:22px 24px;
    display:flex;
    justify-content:space-between;
    align-items:center;
    gap:16px;
    margin-bottom:16px;
    flex-wrap:wrap;
  }
  .testcard .info h3{
    margin:0 0 6px;
    font-size:1.05rem;
  }
  .testcard .info p{
    margin:0;
    color:var(--text-dim);
    font-size:.85rem;
  }
  .testcard .meta{
    display:flex;
    gap:14px;
    margin-top:10px;
    font-size:.8rem;
    color:var(--text-dim);
  }
  .testcard .meta span{
    background:var(--panel-2);
    border:1px solid var(--border);
    padding:4px 10px;
    border-radius:6px;
  }
  a.startbtn{
    font-family:'Inter',sans-serif;
    font-weight:600;
    font-size:.92rem;
    padding:11px 22px;
    border-radius:8px;
    background:var(--accent);
    color:#06251a;
    text-decoration:none;
    white-space:nowrap;
  }
  a.startbtn:hover{ background:#33c877; }

  .empty{
    color:var(--text-dim);
    font-size:.9rem;
    padding:20px 0;
    text-align:center;
    border-top:1px solid var(--border);
    margin-top:10px;
  }
</style>
</head>
<body>
<div class="wrap">
  <header>
    <h1>NEET Practice Tests</h1>
    <p>Apna test chuno aur shuru karo. Har test ke baad score aur topic-wise analysis milega.</p>
  </header>

  <div class="testcard">
    <div class="info">
      <h3>Demo Practice Test</h3>
      <p>Physics, Chemistry, Botany, Zoology ke sample questions</p>
      <div class="meta">
        <span>10 Questions</span>
        <span>10 min</span>
      </div>
    </div>
    <a class="startbtn" href="test.html">Start Test</a>
  </div>

  <div class="empty">Naye tests jald hi add honge.</div>
</div>
</body>
</html>
