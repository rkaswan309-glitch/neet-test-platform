<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Students Data - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720; --panel:#16212c; --panel-2:#1c2a37;
    --accent:#3ddc84; --danger:#ff6b5e;
    --text:#eef3f6; --text-dim:#9fb0bc; --border:#26343f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2{font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:1000px;margin:0 auto;padding:30px 18px 80px;}
  .hidden{display:none !important;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:.9rem;margin-bottom:22px;}
  button{font-family:'Inter',sans-serif;font-weight:600;font-size:.9rem;padding:10px 18px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;}
  button:hover{border-color:#3a4b58;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06251a;}
  input,select{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:.9rem;}
  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .logincard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:34px 28px;max-width:360px;width:100%;text-align:center;}
  .logincard h2{margin:0 0 20px;font-size:1.3rem;}
  .logincard input{width:100%;margin-bottom:12px;}
  .err{color:var(--danger);font-size:.82rem;min-height:16px;margin-bottom:6px;}
  .toolbar{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:16px;align-items:center;}
  .toolbar input{flex:1;min-width:160px;}
  .stats{display:flex;gap:14px;flex-wrap:wrap;margin-bottom:16px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 18px;}
  .stat .n{font-family:'Space Grotesk',sans-serif;font-size:1.3rem;color:var(--accent);}
  .stat .l{font-size:.75rem;color:var(--text-dim);}
  .tablewrap{overflow-x:auto;background:var(--panel);border:1px solid var(--border);border-radius:12px;}
  table{width:100%;border-collapse:collapse;font-size:.85rem;}
  th,td{padding:11px 14px;text-align:left;border-bottom:1px solid var(--border);white-space:nowrap;}
  th{color:var(--text-dim);font-weight:500;font-size:.78rem;}
  tr:last-child td{border-bottom:none;}
  #logoutBtn{position:fixed;top:16px;right:16px;}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginScreen" class="center-screen hidden">
    <div class="logincard">
      <h2>Admin Login</h2>
      <input type="text" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <div class="err" id="loginErr"></div>
      <button class="primary" style="width:100%;padding:12px;" id="loginBtn">Login</button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <button id="logoutBtn">Logout</button>
    <h1>Students Data</h1>
    <div class="sub">Sabhi students ke attempts — naam, mobile, score aur rank</div>

    <div class="stats">
      <div class="stat"><div class="n" id="statAttempts">0</div><div class="l">Total attempts</div></div>
      <div class="stat"><div class="n" id="statStudents">0</div><div class="l">Unique students</div></div>
      <div class="stat"><div class="n" id="statAvg">0</div><div class="l">Average score (filter ke hisaab se)</div></div>
    </div>

    <div class="toolbar">
      <select id="testFilter"><option value="">Sabhi tests</option></select>
      <input type="text" id="searchBox" placeholder="Naam ya mobile se dhundo">
      <button id="csvBtn">CSV Download</button>
    </div>

    <div class="tablewrap">
      <table>
        <thead>
          <tr><th>Rank</th><th>Naam</th><th>Mobile</th><th>Test</th><th>Score</th><th>Sahi</th><th>Galat</th><th>Skip</th><th>Date</th></tr>
        </thead>
        <tbody id="tbody"></tbody>
      </table>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, query, orderBy } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const auth = getAuth();
  const $ = id => document.getElementById(id);
  let attempts = [];
  let loaded = false;

  onAuthStateChanged(auth, (user)=>{
    if(user){
      $('loginScreen').classList.add('hidden');
      $('panel').classList.remove('hidden');
      if(!loaded){ loaded = true; loadAttempts(); }
    } else {
      $('loginScreen').classList.remove('hidden');
      $('panel').classList.add('hidden');
      loaded = false;
    }
  });

  $('loginBtn').onclick = ()=>{
    $('loginErr').textContent = '';
    signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPassword').value)
      .catch(err=>{ $('loginErr').textContent = "Login galat hai: " + err.message; });
  };
  $('logoutBtn').onclick = ()=> signOut(auth);

  async function loadAttempts(){
    try{
      const snap = await getDocs(query(collection(db, "attempts"), orderBy("submittedAt", "desc")));
      attempts = snap.docs.map(d=>{
        const x = d.data();
        return {
          name: x.name || '', mobile: x.mobile || '',
          testId: x.testId || '', testTitle: x.testTitle || '(unknown)',
          score: x.score ?? 0, maxScore: x.maxScore ?? 0,
          correct: x.correct ?? 0, wrong: x.wrong ?? 0, skipped: x.skipped ?? 0,
          date: x.submittedAt ? x.submittedAt.toDate() : null
        };
      });
      const titles = [...new Set(attempts.map(a=>a.testTitle))];
      titles.forEach(t=>{
        const o = document.createElement('option');
        o.value = t; o.textContent = t;
        $('testFilter').appendChild(o);
      });
      render();
    } catch(err){
      $('tbody').innerHTML = '';
      const tr = document.createElement('tr');
      const td = document.createElement('td');
      td.colSpan = 9; td.textContent = "Data load nahi hua: " + err.message;
      tr.appendChild(td); $('tbody').appendChild(tr);
    }
  }

  function currentRows(){
    const t = $('testFilter').value;
    const s = $('searchBox').value.trim().toLowerCase();
    let rows = attempts.filter(a => !t || a.testTitle === t);
    // rank score ke hisaab se (filter kiye hue test ke andar)
    const sorted = [...rows].sort((a,b)=> b.score - a.score);
    sorted.forEach((a,i)=>{ a.rank = i+1; });
    rows = sorted;
    if(s) rows = rows.filter(a => a.name.toLowerCase().includes(s) || a.mobile.includes(s));
    return rows;
  }

  function render(){
    const rows = currentRows();
    const tb = $('tbody');
    tb.innerHTML = '';
    rows.forEach(a=>{
      const tr = document.createElement('tr');
      const cells = [
        a.rank, a.name, a.mobile, a.testTitle,
        a.score + " / " + a.maxScore, a.correct, a.wrong, a.skipped,
        a.date ? a.date.toLocaleString('en-IN') : ''
      ];
      cells.forEach(c=>{
        const td = document.createElement('td');
        td.textContent = c;   // textContent => student ke likhe naam se koi code nahi chalega
        tr.appendChild(td);
      });
      tb.appendChild(tr);
    });
    $('statAttempts').textContent = attempts.length;
    $('statStudents').textContent = new Set(attempts.map(a=>a.mobile)).size;
    const avg = rows.length ? (rows.reduce((s,a)=>s+a.score,0)/rows.length) : 0;
    $('statAvg').textContent = avg.toFixed(1);
  }

  $('testFilter').onchange = render;
  $('searchBox').oninput = render;

  $('csvBtn').onclick = ()=>{
    const rows = currentRows();
    const esc = v => '"' + String(v).replace(/"/g,'""') + '"';
    const head = ['Rank','Naam','Mobile','Test','Score','MaxScore','Sahi','Galat','Skip','Date'];
    const lines = [head.map(esc).join(',')];
    rows.forEach(a=>{
      lines.push([a.rank,a.name,a.mobile,a.testTitle,a.score,a.maxScore,a.correct,a.wrong,a.skipped,
        a.date ? a.date.toLocaleString('en-IN') : ''].map(esc).join(','));
    });
    const blob = new Blob(["\ufeff" + lines.join("\n")], {type:'text/csv;charset=utf-8;'});
    const url = URL.createObjectURL(blob);
    const link = document.createElement('a');
    link.href = url; link.download = 'students-data.csv';
    link.click();
    URL.revokeObjectURL(url);
  };
</script>
</body>
</html>
