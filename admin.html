<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Panel - NEET Test Platform</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720; --panel:#16212c; --panel-2:#1c2a37;
    --accent:#3ddc84; --accent-dim:#1f8f56; --danger:#ff6b5e;
    --text:#eef3f6; --text-dim:#9fb0bc; --border:#26343f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:840px;margin:0 auto;padding:30px 18px 80px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:.9rem;margin-bottom:26px;}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:22px;margin-bottom:20px;}
  .card h2{font-size:1.05rem;margin:0 0 16px;}
  label{display:block;font-size:.82rem;color:var(--text-dim);margin:12px 0 5px;}
  input[type=text], input[type=number], textarea, select{
    width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;
    color:var(--text);padding:10px 12px;font-family:'Inter',sans-serif;font-size:.92rem;
  }
  textarea{min-height:60px;resize:vertical;}
  .row{display:flex;gap:12px;flex-wrap:wrap;}
  .row > div{flex:1;min-width:140px;}
  .opt-row{display:flex;align-items:center;gap:10px;margin-bottom:8px;}
  .opt-row input[type=text]{flex:1;}
  .opt-row input[type=radio]{width:18px;height:18px;accent-color:var(--accent);}
  button{
    font-family:'Inter',sans-serif;font-weight:600;font-size:.9rem;
    padding:10px 20px;border-radius:8px;border:1px solid var(--border);
    background:var(--panel-2);color:var(--text);cursor:pointer;
  }
  button:hover{border-color:#3a4b58;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06251a;}
  button.primary:hover{background:#33c877;}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  .qlist{margin-top:10px;}
  .qitem{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:12px 14px;margin-bottom:8px;font-size:.85rem;display:flex;justify-content:space-between;align-items:flex-start;gap:10px;}
  .qitem .qtext{flex:1;}
  .qitem .qtopic{color:var(--accent);font-size:.75rem;}
  .remark-row{display:flex;gap:8px;margin-bottom:8px;align-items:center;}
  .remark-row input{flex:1;}
  .imgpreview{max-width:160px;border-radius:6px;margin-top:8px;display:none;}
  .status{font-size:.82rem;margin-top:8px;min-height:18px;}
  .status.ok{color:var(--accent);}
  .status.err{color:var(--danger);}
  .count-badge{background:var(--accent);color:#06251a;border-radius:20px;padding:2px 10px;font-size:.78rem;font-weight:700;}
  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .logincard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:34px 28px;max-width:360px;width:100%;text-align:center;}
  .logincard h2{margin:0 0 20px;font-size:1.3rem;font-family:'Space Grotesk',sans-serif;}
  .logincard input{width:100%;background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px 14px;font-size:.95rem;margin-bottom:12px;}
  .err{color:var(--danger);font-size:.82rem;min-height:16px;margin-bottom:6px;}
  #logoutBtn{position:fixed;top:16px;right:16px;}
  .hidden{display:none;}
</style>
</head>
<body>
<div class="wrap">

  <!-- LOGIN SCREEN -->
  <div id="loginScreen" class="center-screen hidden">
    <div class="logincard">
      <h2>Admin Login</h2>
      <input type="text" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <div class="err" id="loginErr"></div>
      <button class="primary" style="width:100%;padding:12px;" onclick="doLogin()">Login</button>
    </div>
  </div>

  <!-- ADMIN PANEL (hidden until logged in) -->
  <div id="adminPanel" class="hidden">
  <button id="logoutBtn" onclick="doLogout()">Logout</button>
  <h1 id="pageTitle">Admin Panel</h1>
  <div class="sub" id="pageSub">Naya test banao — question add karo aur publish karo</div>
  <div style="margin-bottom:18px;display:flex;gap:16px;flex-wrap:wrap;font-size:.88rem;">
    <a href="manage.html" style="color:var(--accent);text-decoration:none;font-weight:600;">Manage Tests (edit / delete)</a>
    <a href="students.html" style="color:var(--accent);text-decoration:none;font-weight:600;">Students Data</a>
  </div>

  <!-- TEST INFO -->
  <div class="card">
    <h2>1. Test ki jaankari</h2>
    <div class="row">
      <div>
        <label>Test Series (jaise "Weekly Test Series")</label>
        <input type="text" id="seriesName" placeholder="e.g. Weekly Test Series">
      </div>
      <div>
        <label>Test ka naam</label>
        <input type="text" id="testTitle" placeholder="e.g. Physics Full Test 1">
      </div>
    </div>
    <div class="row">
      <div>
        <label>Har sahi jawab ke marks</label>
        <input type="number" id="marksCorrect" value="4">
      </div>
      <div>
        <label>Negative marking (galat jawab pe)</label>
        <input type="number" id="marksWrong" value="1">
      </div>
      <div>
        <label>Timer (minutes me)</label>
        <input type="number" id="timerMin" value="180">
      </div>
    </div>
  </div>

  <!-- REMARKS -->
  <div class="card">
    <h2>2. Marks ke hisaab se Remarks</h2>
    <div id="remarksBox"></div>
    <button onclick="addRemarkRow()">+ Remark add karo</button>
  </div>

  <!-- ADD QUESTION -->
  <div class="card">
    <h2>3. Question add karo <span class="count-badge" id="qCount">0 added</span></h2>
    <label>Topic / Chapter</label>
    <input type="text" id="qTopic" placeholder="e.g. Physics - Current Electricity">

    <label>Question text</label>
    <textarea id="qText" placeholder="Question yahan likho"></textarea>

    <label>Diagram / Photo (optional)</label>
    <input type="file" id="qImage" accept="image/*">
    <img id="imgPreview" class="imgpreview">
    <button type="button" id="removeImgBtn" class="danger hidden" style="margin-top:8px;">Photo hatao</button>
    <div class="status" id="uploadStatus"></div>

    <label>Options (sahi jawab ke saamne wala radio button select karo)</label>
    <div class="opt-row"><input type="radio" name="correct" value="0" checked><input type="text" id="opt0" placeholder="Option A"></div>
    <div class="opt-row"><input type="radio" name="correct" value="1"><input type="text" id="opt1" placeholder="Option B"></div>
    <div class="opt-row"><input type="radio" name="correct" value="2"><input type="text" id="opt2" placeholder="Option C"></div>
    <div class="opt-row"><input type="radio" name="correct" value="3"><input type="text" id="opt3" placeholder="Option D"></div>

    <label>Explanation (optional)</label>
    <textarea id="qExplanation" placeholder="Sahi jawab kyun sahi hai"></textarea>

    <div style="margin-top:14px;">
      <button class="primary" id="addBtn" onclick="addQuestion()">Question List me Add karo</button>
      <button id="cancelEditBtn" class="hidden" onclick="cancelEdit()">Edit cancel karo</button>
    </div>
    <div class="status" id="qStatus"></div>
  </div>

  <!-- QUESTION LIST -->
  <div class="card">
    <h2>4. Test ke Questions (Edit / Remove yahan se)</h2>
    <div class="qlist" id="qList"><div class="sub">Abhi koi question add nahi hua.</div></div>
  </div>

  <!-- PUBLISH -->
  <div class="card">
    <button class="primary" id="publishBtn" style="width:100%;padding:14px;font-size:1rem;" onclick="publishTest()">Test Publish Karo</button>
    <div class="status" id="publishStatus"></div>
  </div>
  </div><!-- /adminPanel -->
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, addDoc, doc, getDoc, updateDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const auth = getAuth();
  const $ = id => document.getElementById(id);
  const editId = new URLSearchParams(location.search).get('edit');
  let editLoaded = false;

  onAuthStateChanged(auth, (user)=>{
    if(user){
      $('loginScreen').classList.add('hidden');
      $('adminPanel').classList.remove('hidden');
      if(editId && !editLoaded){ editLoaded = true; loadForEdit(); }
    } else {
      $('loginScreen').classList.remove('hidden');
      $('adminPanel').classList.add('hidden');
    }
  });

  window.doLogin = function(){
    const email = $('loginEmail').value.trim();
    const password = $('loginPassword').value;
    const errEl = $('loginErr');
    errEl.textContent = '';
    signInWithEmailAndPassword(auth, email, password)
      .catch(err=>{ errEl.textContent = "Login galat hai: " + err.message; });
  }
  window.doLogout = function(){ signOut(auth); }

  const CLOUD_NAME = "qre5hpol";
  const UPLOAD_PRESET = "neet_question";

  let questions = [];
  let uploadedImageUrl = null;
  let editIndex = null;

  // ---- Remarks ----
  window.addRemarkRow = function(min="", max="", text=""){
    const row = document.createElement('div');
    row.className = 'remark-row';
    const a = document.createElement('input'); a.type='number'; a.placeholder='Min score'; a.className='rmin'; a.value=min;
    const b = document.createElement('input'); b.type='number'; b.placeholder='Max score'; b.className='rmax'; b.value=max;
    const c = document.createElement('input'); c.type='text'; c.placeholder='Remark text'; c.className='rtext'; c.value=text;
    const x = document.createElement('button'); x.className='danger'; x.textContent='X'; x.onclick=()=>row.remove();
    row.append(a,b,c,x);
    $('remarksBox').appendChild(row);
  }
  if(!editId){
    addRemarkRow(600,720,"Excellent! Top government college ka strong chance.");
    addRemarkRow(450,599,"Good score, thoda aur practice karo.");
    addRemarkRow(0,449,"Weak areas par zyada focus karo.");
  }

  // ---- Image handling ----
  function setImage(url){
    uploadedImageUrl = url || null;
    const preview = $('imgPreview');
    if(url){ preview.src = url; preview.style.display = 'block'; $('removeImgBtn').classList.remove('hidden'); }
    else { preview.removeAttribute('src'); preview.style.display = 'none'; $('removeImgBtn').classList.add('hidden'); }
  }
  $('removeImgBtn').onclick = ()=>{ setImage(null); $('qImage').value=''; $('uploadStatus').textContent=''; };

  $('qImage').addEventListener('change', async (e)=>{
    const file = e.target.files[0];
    if(!file) return;
    const statusEl = $('uploadStatus');
    statusEl.textContent = "Uploading...";
    statusEl.className = "status";

    const formData = new FormData();
    formData.append('file', file);
    formData.append('upload_preset', UPLOAD_PRESET);
    try {
      const res = await fetch(`https://api.cloudinary.com/v1_1/${CLOUD_NAME}/image/upload`, { method:'POST', body: formData });
      const data = await res.json();
      if(data.secure_url){
        setImage(data.secure_url);
        statusEl.textContent = "Photo upload ho gayi!";
        statusEl.className = "status ok";
      } else { throw new Error(data.error?.message || "Upload failed"); }
    } catch(err){
      statusEl.textContent = "Upload me error: " + err.message;
      statusEl.className = "status err";
    }
  });

  // ---- Question form ----
  function resetForm(){
    $('qTopic').value = '';
    $('qText').value = '';
    [0,1,2,3].forEach(i=>$('opt'+i).value = '');
    document.querySelector('input[name=correct][value="0"]').checked = true;
    $('qExplanation').value = '';
    $('qImage').value = '';
    $('uploadStatus').textContent = '';
    setImage(null);
    editIndex = null;
    $('addBtn').textContent = 'Question List me Add karo';
    $('cancelEditBtn').classList.add('hidden');
  }
  window.cancelEdit = function(){ resetForm(); $('qStatus').textContent = ''; }

  window.addQuestion = function(){
    const topic = $('qTopic').value.trim();
    const text = $('qText').value.trim();
    const opts = [0,1,2,3].map(i=>$('opt'+i).value.trim());
    const correct = parseInt(document.querySelector('input[name=correct]:checked').value);
    const explanation = $('qExplanation').value.trim();
    const statusEl = $('qStatus');

    if(!topic || !text || opts.some(o=>!o)){
      statusEl.textContent = "Topic, question text aur sabhi 4 options bharo.";
      statusEl.className = "status err";
      return;
    }
    const q = { topic, text, options: opts, correct, explanation, image: uploadedImageUrl || null };
    const wasEdit = editIndex !== null;
    if(wasEdit){ questions[editIndex] = q; } else { questions.push(q); }
    resetForm();
    statusEl.textContent = wasEdit ? "Question update ho gaya! (Test me save karna mat bhoolna)" : "Question add ho gaya!";
    statusEl.className = "status ok";
    renderQList();
  }

  window.editQuestion = function(idx){
    const q = questions[idx];
    editIndex = idx;
    $('qTopic').value = q.topic || '';
    $('qText').value = q.text || '';
    [0,1,2,3].forEach(i=>$('opt'+i).value = (q.options && q.options[i]) || '');
    const r = document.querySelector('input[name=correct][value="'+(q.correct||0)+'"]');
    if(r) r.checked = true;
    $('qExplanation').value = q.explanation || '';
    $('qImage').value = '';
    $('uploadStatus').textContent = '';
    setImage(q.image);
    $('addBtn').textContent = 'Question #' + (idx+1) + ' Update karo';
    $('cancelEditBtn').classList.remove('hidden');
    $('qStatus').textContent = 'Question #' + (idx+1) + ' edit ho raha hai.';
    $('qStatus').className = 'status';
    $('qTopic').scrollIntoView({behavior:'smooth', block:'center'});
  }

  window.removeQuestion = function(idx){
    if(!confirm('Question #' + (idx+1) + ' hataana hai?')) return;
    questions.splice(idx,1);
    if(editIndex !== null) resetForm();
    renderQList();
  }

  function renderQList(){
    const el = $('qList');
    $('qCount').textContent = questions.length + " added";
    el.innerHTML = '';
    if(questions.length === 0){
      const d = document.createElement('div'); d.className='sub'; d.textContent='Abhi koi question add nahi hua.';
      el.appendChild(d);
      return;
    }
    questions.forEach((q, idx)=>{
      const div = document.createElement('div');
      div.className = 'qitem';
      const left = document.createElement('div'); left.className = 'qtext';
      const t1 = document.createElement('div');
      t1.textContent = (idx+1) + '. ' + q.text.slice(0,90) + (q.text.length>90 ? '...' : '');
      const t2 = document.createElement('div'); t2.className = 'qtopic';
      t2.textContent = q.topic + (q.image ? ' • 📷' : '');
      left.append(t1,t2);
      const btns = document.createElement('div'); btns.style.display='flex'; btns.style.gap='6px';
      const e = document.createElement('button'); e.textContent='Edit'; e.onclick=()=>editQuestion(idx);
      const r = document.createElement('button'); r.className='danger'; r.textContent='Remove'; r.onclick=()=>removeQuestion(idx);
      btns.append(e,r);
      div.append(left,btns);
      el.appendChild(div);
    });
  }

  // ---- Load existing test for editing ----
  async function loadForEdit(){
    $('pageTitle').textContent = 'Edit Test';
    $('pageSub').textContent = 'Test load ho raha hai...';
    $('publishBtn').textContent = 'Changes Save Karo';
    try{
      const snap = await getDoc(doc(db, 'tests', editId));
      if(!snap.exists()){ $('pageSub').textContent = 'Ye test nahi mila (shayad delete ho chuka hai).'; return; }
      const d = snap.data();
      $('seriesName').value = d.series || '';
      $('testTitle').value = d.title || '';
      $('marksCorrect').value = d.marksCorrect ?? 4;
      $('marksWrong').value = d.marksWrong ?? 1;
      $('timerMin').value = d.timerMin ?? 60;
      $('remarksBox').innerHTML = '';
      (d.remarks || []).forEach(r => addRemarkRow(r.min, r.max, r.text));
      questions = d.questions || [];
      renderQList();
      $('pageSub').textContent = 'Editing: ' + (d.title || '') + ' — badlav karo aur neeche "Changes Save Karo" dabao';
    } catch(err){
      $('pageSub').textContent = 'Load me error: ' + err.message;
    }
  }

  // ---- Publish / Save ----
  window.publishTest = async function(){
    const series = $('seriesName').value.trim();
    const title = $('testTitle').value.trim();
    const marksCorrect = parseFloat($('marksCorrect').value) || 0;
    const marksWrong = parseFloat($('marksWrong').value) || 0;
    const timerMin = parseInt($('timerMin').value) || 60;
    const statusEl = $('publishStatus');

    const remarks = [...document.querySelectorAll('.remark-row')].map(row=>({
      min: parseFloat(row.querySelector('.rmin').value) || 0,
      max: parseFloat(row.querySelector('.rmax').value) || 0,
      text: row.querySelector('.rtext').value.trim()
    })).filter(r=>r.text);

    if(!series || !title){
      statusEl.textContent = "Series aur test ka naam dono bharo.";
      statusEl.className = "status err";
      return;
    }
    if(questions.length === 0){
      statusEl.textContent = "Kam se kam ek question add karo.";
      statusEl.className = "status err";
      return;
    }

    statusEl.textContent = editId ? "Save ho raha hai..." : "Publish ho raha hai...";
    statusEl.className = "status";

    try {
      if(editId){
        await updateDoc(doc(db, 'tests', editId), {
          series, title, marksCorrect, marksWrong, timerMin, remarks, questions,
          updatedAt: serverTimestamp()
        });
        statusEl.textContent = "Changes save ho gaye! Ab students ko naya version dikhega.";
      } else {
        await addDoc(collection(db, "tests"), {
          series, title, marksCorrect, marksWrong, timerMin,
          remarks, questions,
          createdAt: serverTimestamp()
        });
        statusEl.textContent = "Test successfully publish ho gaya! Home page par jaake dekho.";
        questions = [];
        renderQList();
        $('testTitle').value = '';
      }
      statusEl.className = "status ok";
    } catch(err){
      statusEl.textContent = "Error: " + err.message;
      statusEl.className = "status err";
    }
  }
</script>
</body>
</html>
