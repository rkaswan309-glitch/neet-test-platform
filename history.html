<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Results - NEET Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720; --panel:#16212c; --panel-2:#1c2a37;
    --accent:#3ddc84; --danger:#ff6b5e;
    --text:#eef3f6; --text-dim:#9fb0bc; --border:#26343f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;min-height:100vh;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  .wrap{max-width:760px;margin:0 auto;padding:30px 18px 60px;}
  .topbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:10px;}
  .topbar a{color:var(--accent);text-decoration:none;font-weight:600;font-size:.9rem;}
  .topbar button{background:none;border:1px solid var(--border);color:var(--text-dim);border-radius:8px;padding:6px 12px;cursor:pointer;font-family:'Inter',sans-serif;font-size:.82rem;}
  h1{font-size:1.6rem;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:.9rem;margin-bottom:22px;}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
  .stat{background:var(--panel);border:1px solid var(--border);border-radius:10px;padding:12px 18px;flex:1;min-width:120px;}
  .stat .n{font-family:'Space Grotesk',sans-serif;font-size:1.4rem;color:var(--accent);}
  .stat .l{font-size:.75rem;color:var(--text-dim);}
  .attempt{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:14px;}
  .attempt .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .attempt h3{margin:0 0 4px;font-size:1.02rem;}
  .attempt .date{color:var(--text-dim);font-size:.78rem;}
  .attempt .score{font-family:'Space Grotesk',sans-serif;font-size:1.5rem;color:var(--accent);text-align:right;}
  .attempt .score small{display:block;font-size:.72rem;color:var(--text-dim);font-family:'Inter',sans-serif;}
  .counts{display:flex;gap:16px;margin:12px 0;font-size:.82rem;color:var(--text-dim);}
  .counts b{color:var(--text);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:6px;align-items:center;font-size:.78rem;color:var(--text-dim);}
  .tag{padding:3px 10px;border-radius:20px;border:1px solid var(--border);font-size:.76rem;}
  .tag.weak{border-color:var(--danger);color:var(--danger);}
  .tag.strong{border-color:var(--accent);color:var(--accent);}
  .empty{color:var(--text-dim);text-align:center;padding:40px 0;}
  .empty a{color:var(--accent);}
</style>
</head>
<body>
<div class="wrap">
  <div class="topbar">
    <a href="index.html">&larr; Home</a>
    <div><span id="who" style="color:var(--text-dim);font-size:.85rem;margin-right:10px;"></span><button id="logoutBtn">Logout</button></div>
  </div>
  <h1>My Results</h1>
  <div class="sub">Your attempted tests, scores and topic-wise analysis</div>

  <div class="stats hidden" id="stats" style="display:none;">
    <div class="stat"><div class="n" id="sTests">0</div><div class="l">Tests attempted</div></div>
    <div class="stat"><div class="n" id="sBest">0</div><div class="l">Best score</div></div>
    <div class="stat"><div class="n" id="sAvg">0</div><div class="l">Average score</div></div>
  </div>

  <div id="list"><div class="empty">Loading your results...</div></div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const DOMAIN = "@students.neetplatform.app";
  const auth = getAuth();
  const $ = id => document.getElementById(id);
  let loadStarted = false;

  function mk(tag, text, cls){
    const e = document.createElement(tag);
    if(text != null) e.textContent = text;
    if(cls) e.className = cls;
    return e;
  }

  $('logoutBtn').onclick = async () => { await signOut(auth); location.href = 'index.html'; };

  onAuthStateChanged(auth, u => {
    if(!(u && u.email && u.email.endsWith(DOMAIN))){
      location.replace('login.html?next=history.html');
      return;
    }
    $('who').textContent = u.displayName || 'Student';
    if(!loadStarted){ loadStarted = true; load(u); }
  });

  async function load(u){
    const list = $('list');
    try{
      // Only this student's own attempts (security rules enforce this too)
      const snap = await getDocs(query(collection(db, "attempts"), where("uid", "==", u.uid)));
      const rows = snap.docs.map(d => d.data());
      rows.sort((a,b) => (b.submittedAt ? b.submittedAt.toMillis() : 0) - (a.submittedAt ? a.submittedAt.toMillis() : 0));

      list.innerHTML = '';
      if(!rows.length){
        const e = mk('div', null, 'empty');
        e.appendChild(document.createTextNode("You haven't attempted any test yet. "));
        const a = mk('a', 'Start a test'); a.href = 'index.html';
        e.appendChild(a);
        list.appendChild(e);
        return;
      }

      const scores = rows.map(r => r.score ?? 0);
      $('sTests').textContent = rows.length;
      $('sBest').textContent = Math.max(...scores);
      $('sAvg').textContent = (scores.reduce((s,x) => s + x, 0) / scores.length).toFixed(1);
      $('stats').style.display = 'flex';

      rows.forEach(r => {
        const card = mk('div', null, 'attempt');
        const head = mk('div', null, 'head');
        const left = mk('div');
        left.appendChild(mk('h3', r.testTitle || 'Test'));
        left.appendChild(mk('div', r.submittedAt ? r.submittedAt.toDate().toLocaleString('en-IN') : '', 'date'));
        const right = mk('div', null, 'score');
        right.appendChild(document.createTextNode(String(r.score ?? 0)));
        right.appendChild(mk('small', 'out of ' + (r.maxScore ?? 0)));
        head.appendChild(left); head.appendChild(right);
        card.appendChild(head);

        const counts = mk('div', null, 'counts');
        [['Correct', r.correct], ['Wrong', r.wrong], ['Skipped', r.skipped]].forEach(([l, v]) => {
          const s = mk('span', l + ': '); s.appendChild(mk('b', String(v ?? 0))); counts.appendChild(s);
        });
        card.appendChild(counts);

        const weak = [], strong = [];
        Object.entries(r.topicStats || {}).forEach(([topic, s]) => {
          if(!s.total) return;
          const pct = Math.round(s.correct / s.total * 100);
          if(pct < 40) weak.push(topic + ' (' + pct + '%)');
          else if(pct >= 70) strong.push(topic + ' (' + pct + '%)');
        });
        if(weak.length){
          const row = mk('div', null, 'tags'); row.appendChild(mk('span', 'Weak:'));
          weak.forEach(t => row.appendChild(mk('span', t, 'tag weak'))); card.appendChild(row);
        }
        if(strong.length){
          const row = mk('div', null, 'tags'); row.appendChild(mk('span', 'Strong:'));
          strong.forEach(t => row.appendChild(mk('span', t, 'tag strong'))); card.appendChild(row);
        }
        list.appendChild(card);
      });
    } catch(err){
      list.innerHTML = '';
      list.appendChild(mk('div', 'Could not load your results: ' + err.message, 'empty'));
    }
  }
</script>
</body>
</html>
