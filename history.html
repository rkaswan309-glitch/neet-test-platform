<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Results — NEET Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="student-styles.css">
<style>
  .page-head{padding:32px 0 6px;}
  .page-head h1{font-size:1.7rem;margin:0 0 4px;}
  .page-head p{color:var(--ink-dim);margin:0 0 22px;}
  .stats{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px;}
  .stat{background:var(--surface);border:1px solid var(--line);border-radius:10px;padding:14px 18px;flex:1;min-width:130px;}
  .stat .n{font-family:'Fraunces',serif;font-size:1.5rem;color:var(--primary);}
  .stat .l{font-size:.76rem;color:var(--ink-dim);}
  .attempt{background:var(--surface);border:1px solid var(--line);border-left:4px solid var(--primary);border-radius:10px;padding:18px 20px;margin-bottom:12px;}
  .attempt .head{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;flex-wrap:wrap;}
  .attempt h3{margin:0 0 4px;font-size:1rem;font-family:'Inter',sans-serif;font-weight:600;}
  .attempt .date{color:var(--ink-dim);font-size:.78rem;}
  .attempt .score{font-family:'Fraunces',serif;font-size:1.4rem;color:var(--accent-dark);text-align:right;}
  .attempt .score small{display:block;font-size:.72rem;color:var(--ink-dim);font-family:'Inter',sans-serif;font-weight:400;}
  .counts{display:flex;gap:16px;margin:12px 0;font-size:.82rem;color:var(--ink-dim);}
  .counts b{color:var(--ink);}
  .tags{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px;align-items:center;font-size:.78rem;color:var(--ink-dim);}
  .tag{padding:3px 10px;border-radius:20px;border:1px solid var(--line);font-size:.76rem;}
  .tag.weak{border-color:var(--danger);color:var(--danger);}
  .tag.strong{border-color:var(--accent);color:var(--accent-dark);}
</style>
</head>
<body>

<header class="site-header">
  <div class="shell nav">
    <a class="brand" href="index.html">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="34" y2="34">
          <stop offset="0" stop-color="#24398B"/><stop offset="1" stop-color="#0F9D82"/>
        </linearGradient></defs>
        <rect width="34" height="34" rx="10" fill="url(#lg1)"/>
        <rect x="15" y="8" width="4" height="18" rx="2" fill="white"/>
        <rect x="8" y="15" width="18" height="4" rx="2" fill="white"/>
      </svg>
      <span class="brand-word">NEET Practice Tests</span>
    </a>
    <nav class="nav-links"><a href="index.html">Mock Tests</a><a href="about.html">About Us</a></nav>
    <div class="nav-auth" id="authBar"></div>
  </div>
</header>

<div class="shell narrow">
  <div class="page-head">
    <h1>My Results</h1>
    <p>Your attempted tests, scores and topic-wise analysis</p>
  </div>

  <div class="stats" id="stats" style="display:none;">
    <div class="stat"><div class="n" id="sTests">0</div><div class="l">Tests attempted</div></div>
    <div class="stat"><div class="n" id="sBest">0</div><div class="l">Best score</div></div>
    <div class="stat"><div class="n" id="sAvg">0</div><div class="l">Average score</div></div>
  </div>

  <div id="list"><div class="empty">Loading your results...</div></div>
</div>

<footer class="site-footer">
  <div class="shell"><span>&copy; <span id="yr"></span> NEET Practice Tests</span><a href="index.html">Mock Tests</a></div>
</footer>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, query, where } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  document.getElementById('yr').textContent = new Date().getFullYear();
  const DOMAIN = "@students.neetplatform.app";
  const auth = getAuth();
  const $ = id => document.getElementById(id);
  let loadStarted = false;

  function mk(tag, text, cls){
    const e = document.createElement(tag);
    if(text != null) e.textContent = text;
    if(cls) e.className = cls;
    return e;
  }

  onAuthStateChanged(auth, u => {
    const authBar = $('authBar');
    authBar.innerHTML = '';
    if(u && u.email && u.email.endsWith(DOMAIN)){
      authBar.appendChild(mk('span', 'Hi, ' + (u.displayName || 'Student')));
      const b = mk('button', 'Logout'); b.onclick = async () => { await signOut(auth); location.href='index.html'; };
      authBar.appendChild(b);
      if(!loadStarted){ loadStarted = true; load(u); }
    } else {
      location.replace('login.html?next=history.html');
    }
  });

  function renderTopicChart(container, topicStats){
    const wrap = mk('div', null, 'chart-wrap');
    Object.keys(topicStats).forEach(topic => {
      const s = topicStats[topic];
      const pct = Math.round((s.correct / s.total) * 100);
      const cls = pct >= 70 ? 'strong' : (pct < 40 ? 'weak' : 'mid');
      const col = mk('div', null, 'chart-col');
      const val = mk('div', pct + '%', 'chart-val');
      const bar = mk('div', null, 'chart-bar ' + cls); bar.style.height = '4px';
      const label = mk('div', topic, 'chart-label');
      col.appendChild(val); col.appendChild(bar); col.appendChild(label);
      wrap.appendChild(col);
      requestAnimationFrame(() => { bar.style.height = Math.max(pct, 3) + '%'; });
    });
    container.appendChild(wrap);
  }

  async function load(u){
    const list = $('list');
    try{
      const snap = await getDocs(query(collection(db, "attempts"), where("uid", "==", u.uid)));
      const rows = snap.docs.map(d => d.data());
      rows.sort((a,b) => (b.submittedAt ? b.submittedAt.toMillis() : 0) - (a.submittedAt ? a.submittedAt.toMillis() : 0));

      list.innerHTML = '';
      if(!rows.length){
        const e = mk('div', null, 'empty');
        e.appendChild(document.createTextNode("You haven't attempted any test yet. "));
        const a = mk('a', 'Start a test'); a.href = 'index.html'; a.style.color='var(--accent-dark)';
        e.appendChild(a);
        list.appendChild(e);
        return;
      }

      const scores = rows.map(r => r.score ?? 0);
      $('sTests').textContent = rows.length;
      $('sBest').textContent = Math.max(...scores);
      $('sAvg').textContent = (scores.reduce((s,x) => s + x, 0) / scores.length).toFixed(1);
      $('stats').style.display = 'flex';

      rows.forEach(r => {
        const card = mk('div', null, 'attempt');
        const head = mk('div', null, 'head');
        const left = mk('div');
        left.appendChild(mk('h3', r.testTitle || 'Test'));
        left.appendChild(mk('div', r.submittedAt ? r.submittedAt.toDate().toLocaleString('en-IN') : '', 'date'));
        const right = mk('div', null, 'score');
        right.appendChild(document.createTextNode(String(r.score ?? 0)));
        right.appendChild(mk('small', 'out of ' + (r.maxScore ?? 0)));
        head.appendChild(left); head.appendChild(right);
        card.appendChild(head);

        const counts = mk('div', null, 'counts');
        [['Correct', r.correct], ['Wrong', r.wrong], ['Skipped', r.skipped]].forEach(([l, v]) => {
          const s = mk('span', l + ': '); s.appendChild(mk('b', String(v ?? 0))); counts.appendChild(s);
        });
        card.appendChild(counts);

        if(r.topicStats && Object.keys(r.topicStats).length){
          const chartHolder = mk('div');
          card.appendChild(chartHolder);
          renderTopicChart(chartHolder, r.topicStats);
        }
        list.appendChild(card);
      });
    } catch(err){
      list.innerHTML = '';
      list.appendChild(mk('div', 'Could not load your results: ' + err.message, 'empty'));
    }
  }
</script>
<script src="mascot.js"></script>
</body>
</html>
