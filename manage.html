<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage Tests - Admin</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720; --panel:#16212c; --panel-2:#1c2a37;
    --accent:#3ddc84; --danger:#ff6b5e;
    --text:#eef3f6; --text-dim:#9fb0bc; --border:#26343f;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--bg);color:var(--text);font-family:'Inter',sans-serif;}
  h1,h2,h3{font-family:'Space Grotesk',sans-serif;}
  .hidden{display:none !important;}
  .wrap{max-width:820px;margin:0 auto;padding:30px 18px 80px;}
  h1{font-size:1.5rem;margin:0 0 4px;}
  .sub{color:var(--text-dim);font-size:.9rem;margin-bottom:18px;}
  .links{display:flex;gap:16px;flex-wrap:wrap;margin-bottom:22px;font-size:.88rem;}
  .links a{color:var(--accent);text-decoration:none;font-weight:600;}
  button, a.btn{font-family:'Inter',sans-serif;font-weight:600;font-size:.85rem;padding:8px 16px;border-radius:8px;border:1px solid var(--border);background:var(--panel-2);color:var(--text);cursor:pointer;text-decoration:none;display:inline-block;}
  button:hover, a.btn:hover{border-color:#3a4b58;}
  button.primary{background:var(--accent);border-color:var(--accent);color:#06251a;}
  button.danger{background:transparent;border-color:var(--danger);color:var(--danger);}
  input{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;color:var(--text);padding:12px 14px;font-family:'Inter',sans-serif;font-size:.95rem;width:100%;margin-bottom:12px;}
  .center-screen{min-height:80vh;display:flex;align-items:center;justify-content:center;}
  .logincard{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:34px 28px;max-width:360px;width:100%;text-align:center;}
  .logincard h2{margin:0 0 20px;font-size:1.3rem;}
  .err{color:var(--danger);font-size:.82rem;min-height:16px;margin-bottom:6px;}
  .series-title{color:var(--accent);font-family:'Space Grotesk',sans-serif;margin:24px 0 10px;font-size:1rem;}
  .test{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:16px 18px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap;}
  .test .name{font-weight:600;}
  .test .meta{color:var(--text-dim);font-size:.78rem;margin-top:4px;}
  .test .btns{display:flex;gap:8px;}
  #logoutBtn{position:fixed;top:16px;right:16px;}
  .msg{font-size:.85rem;margin-bottom:14px;min-height:18px;}
  .msg.ok{color:var(--accent);} .msg.err{color:var(--danger);}
</style>
</head>
<body>
<div class="wrap">

  <div id="loginScreen" class="center-screen hidden">
    <div class="logincard">
      <h2>Admin Login</h2>
      <input type="text" id="loginEmail" placeholder="Email">
      <input type="password" id="loginPassword" placeholder="Password">
      <div class="err" id="loginErr"></div>
      <button class="primary" style="width:100%;padding:12px;" id="loginBtn">Login</button>
    </div>
  </div>

  <div id="panel" class="hidden">
    <button id="logoutBtn">Logout</button>
    <h1>Manage Tests</h1>
    <div class="sub">Yahan se kisi bhi test ko edit ya delete karo</div>
    <div class="links">
      <a href="admin.html">+ Naya Test Banao</a>
      <a href="students.html">Students Data</a>
    </div>
    <div class="msg" id="msg"></div>
    <div id="list"><div class="sub">Loading...</div></div>
  </div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { collection, getDocs, query, orderBy, doc, deleteDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const auth = getAuth();
  const $ = id => document.getElementById(id);
  let loaded = false;

  function mk(tag, text, cls){
    const e = document.createElement(tag);
    if(text != null) e.textContent = text;
    if(cls) e.className = cls;
    return e;
  }

  onAuthStateChanged(auth, user=>{
    if(user){
      $('loginScreen').classList.add('hidden');
      $('panel').classList.remove('hidden');
      if(!loaded){ loaded = true; loadTests(); }
    } else {
      $('loginScreen').classList.remove('hidden');
      $('panel').classList.add('hidden');
      loaded = false;
    }
  });

  $('loginBtn').onclick = ()=>{
    $('loginErr').textContent = '';
    signInWithEmailAndPassword(auth, $('loginEmail').value.trim(), $('loginPassword').value)
      .catch(err=>{ $('loginErr').textContent = "Login galat hai: " + err.message; });
  };
  $('logoutBtn').onclick = ()=> signOut(auth);

  function say(text, ok){ const m = $('msg'); m.textContent = text; m.className = 'msg ' + (ok ? 'ok' : 'err'); }

  async function loadTests(){
    const list = $('list');
    try{
      const snap = await getDocs(query(collection(db, "tests"), orderBy("createdAt", "desc")));
      list.innerHTML = '';
      if(snap.empty){ list.appendChild(mk('div', 'Abhi koi test nahi hai.', 'sub')); return; }

      const bySeries = {};
      snap.forEach(d=>{
        const t = d.data();
        const s = t.series || 'Other Tests';
        (bySeries[s] = bySeries[s] || []).push({id: d.id, ...t});
      });

      Object.keys(bySeries).forEach(series=>{
        list.appendChild(mk('div', series, 'series-title'));
        bySeries[series].forEach(t=>{
          const row = mk('div', null, 'test');
          const info = mk('div');
          info.appendChild(mk('div', t.title, 'name'));
          const created = t.createdAt ? t.createdAt.toDate().toLocaleDateString('en-IN') : '';
          info.appendChild(mk('div', (t.questions ? t.questions.length : 0) + ' questions • ' + (t.timerMin || 60) + ' min' + (created ? ' • ' + created : ''), 'meta'));
          const btns = mk('div', null, 'btns');
          const edit = mk('a', 'Edit', 'btn'); edit.href = 'admin.html?edit=' + encodeURIComponent(t.id);
          const del = mk('button', 'Delete', 'danger');
          del.onclick = ()=> deleteTest(t, row);
          btns.append(edit, del);
          row.append(info, btns);
          list.appendChild(row);
        });
      });
    } catch(err){
      list.innerHTML = '';
      list.appendChild(mk('div', 'Tests load nahi hue: ' + err.message, 'sub'));
    }
  }

  async function deleteTest(t, row){
    const ok = confirm('Test "' + t.title + '" hamesha ke liye delete ho jayega.\n\n(Students ke purane results/history bache rahenge, sirf test hatega.)\n\nDelete karein?');
    if(!ok) return;
    try{
      await deleteDoc(doc(db, "tests", t.id));
      row.remove();
      say('"' + t.title + '" delete ho gaya.', true);
    } catch(err){
      say('Delete nahi hua: ' + err.message, false);
    }
  }
</script>
</body>
</html>
