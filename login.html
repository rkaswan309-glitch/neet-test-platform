<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Login — NEET Practice Tests</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="student-styles.css">
<style>
  .center{min-height:calc(100vh - 68px);display:flex;align-items:center;justify-content:center;padding:30px 20px;}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:32px 26px;max-width:400px;width:100%;}
  .card h1{font-size:1.4rem;margin:0 0 4px;text-align:center;}
  .card .sub{color:var(--ink-dim);font-size:.88rem;text-align:center;margin-bottom:22px;}
  .tabs{display:flex;gap:8px;margin-bottom:20px;background:var(--bg);border-radius:10px;padding:4px;}
  .tab{flex:1;padding:9px;border-radius:8px;border:none;background:transparent;color:var(--ink-dim);font-weight:600;cursor:pointer;font-family:'Inter',sans-serif;font-size:.88rem;}
  .tab.active{background:var(--surface);color:var(--primary);box-shadow:var(--shadow);}
  label{display:block;font-size:.8rem;color:var(--ink-dim);margin:12px 0 5px;font-weight:500;}
  input{width:100%;background:var(--bg);border:1px solid var(--line);border-radius:8px;color:var(--ink);padding:11px 13px;font-family:'Inter',sans-serif;font-size:.95rem;}
  input:focus{outline:2px solid var(--accent);outline-offset:1px;}
  .err{color:var(--danger);font-size:.83rem;min-height:18px;margin-top:10px;}
  .note{color:var(--ink-dim);font-size:.78rem;margin-top:14px;line-height:1.5;}
  a.back{display:block;text-align:center;color:var(--ink-dim);font-size:.85rem;margin-top:18px;text-decoration:none;}
</style>
</head>
<body>

<header class="site-header">
  <div class="shell nav">
    <a class="brand" href="index.html">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="34" y2="34">
          <stop offset="0" stop-color="#24398B"/><stop offset="1" stop-color="#0F9D82"/>
        </linearGradient></defs>
        <rect width="34" height="34" rx="10" fill="url(#lg1)"/>
        <rect x="15" y="8" width="4" height="18" rx="2" fill="white"/>
        <rect x="8" y="15" width="18" height="4" rx="2" fill="white"/>
      </svg>
      <span class="brand-word">NEET Practice Tests</span>
    </a>
    <nav class="nav-links"><a href="index.html">Mock Tests</a><a href="about.html">About Us</a></nav>
    <div class="nav-auth"></div>
  </div>
</header>

<div class="center">
  <div class="card">
    <h1>Welcome</h1>
    <div class="sub">Login to take tests and track your results</div>

    <div class="tabs">
      <button class="tab active" id="tabLogin">Login</button>
      <button class="tab" id="tabRegister">Register</button>
    </div>

    <div id="nameWrap" class="hidden">
      <label for="fullName">Full name</label>
      <input type="text" id="fullName" placeholder="Your name" autocomplete="name">
    </div>

    <label for="mobile">Mobile number</label>
    <input type="tel" id="mobile" placeholder="10-digit mobile number" maxlength="10" autocomplete="username">

    <label for="password">Password</label>
    <input type="password" id="password" placeholder="At least 6 characters" autocomplete="current-password">

    <div class="err" id="err"></div>
    <button class="btn btn-primary btn-block" id="submitBtn" style="margin-top:16px;">Login</button>

    <div class="note hidden" id="regNote">
      Your mobile number is your login ID. Please remember your password &mdash;
      it cannot be recovered automatically.
    </div>
    <a class="back" href="index.html">&larr; Back to home</a>
  </div>
</div>

<script type="module">
  import './firebase-config.js';
  import { getAuth, createUserWithEmailAndPassword, signInWithEmailAndPassword, updateProfile, onAuthStateChanged }
    from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const DOMAIN = "@students.neetplatform.app";
  const auth = getAuth();
  const $ = id => document.getElementById(id);

  function safeNext(v){
    return (v && /^(test|history|index|about)\.html(\?[A-Za-z0-9=&_-]*)?$/.test(v)) ? v : 'index.html';
  }
  const next = safeNext(new URLSearchParams(location.search).get('next'));

  let mode = 'login';
  let busy = false;

  onAuthStateChanged(auth, u => {
    if(!busy && u && u.email && u.email.endsWith(DOMAIN)) location.replace(next);
  });

  function setMode(m){
    mode = m;
    $('tabLogin').classList.toggle('active', m==='login');
    $('tabRegister').classList.toggle('active', m==='register');
    $('nameWrap').classList.toggle('hidden', m!=='register');
    $('regNote').classList.toggle('hidden', m!=='register');
    $('submitBtn').textContent = m==='login' ? 'Login' : 'Create account';
    $('password').autocomplete = m==='login' ? 'current-password' : 'new-password';
    $('err').textContent = '';
  }
  $('tabLogin').onclick = () => setMode('login');
  $('tabRegister').onclick = () => setMode('register');

  $('submitBtn').onclick = async () => {
    const mobile = $('mobile').value.trim();
    const password = $('password').value;
    const name = $('fullName').value.trim();
    const err = $('err');
    err.textContent = '';

    if(!/^\d{10}$/.test(mobile)){ err.textContent = 'Enter a valid 10-digit mobile number.'; return; }
    if(password.length < 6){ err.textContent = 'Password must be at least 6 characters.'; return; }
    if(mode==='register' && !name){ err.textContent = 'Please enter your name.'; return; }

    $('submitBtn').disabled = true;
    busy = true;
    try{
      if(mode==='register'){
        const cred = await createUserWithEmailAndPassword(auth, mobile + DOMAIN, password);
        await updateProfile(cred.user, { displayName: name });
      } else {
        await signInWithEmailAndPassword(auth, mobile + DOMAIN, password);
      }
      location.replace(next);
    } catch(e){
      busy = false;
      $('submitBtn').disabled = false;
      const code = e.code || '';
      if(code === 'auth/email-already-in-use') err.textContent = 'This mobile number is already registered. Please login.';
      else if(code === 'auth/invalid-credential' || code === 'auth/wrong-password' || code === 'auth/user-not-found') err.textContent = 'Wrong mobile number or password.';
      else if(code === 'auth/too-many-requests') err.textContent = 'Too many attempts. Please try again after some time.';
      else err.textContent = 'Something went wrong. Please try again.';
    }
  };
</script>
<script src="mascot.js"></script>
</body>
</html>
