<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Practice Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#0f1720;
    --panel:#16212c;
    --panel-2:#1c2a37;
    --accent:#3ddc84;
    --accent-dim:#1f8f56;
    --danger:#ff6b5e;
    --text:#eef3f6;
    --text-dim:#9fb0bc;
    --border:#26343f;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    background:var(--bg);
    color:var(--text);
    font-family:'Inter',sans-serif;
    min-height:100vh;
  }
  h1,h2,h3,.mono{
    font-family:'Space Grotesk',sans-serif;
  }
  .wrap{
    max-width:780px;
    margin:0 auto;
    padding:24px 18px 60px;
  }
  header{
    display:flex;
    justify-content:space-between;
    align-items:center;
    margin-bottom:28px;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{
    font-size:1.3rem;
    margin:0;
    letter-spacing:-0.01em;
  }
  #timer{
    font-family:'Space Grotesk',sans-serif;
    font-size:1.1rem;
    background:var(--panel);
    border:1px solid var(--border);
    padding:8px 16px;
    border-radius:8px;
    color:var(--accent);
  }
  #timer.low{ color:var(--danger); border-color:var(--danger); }

  .progress-track{
    height:4px;
    background:var(--border);
    border-radius:2px;
    overflow:hidden;
    margin-bottom:28px;
  }
  .progress-fill{
    height:100%;
    background:var(--accent);
    width:0%;
    transition:width .25s ease;
  }

  .qcard{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:24px;
  }
  .qmeta{
    display:flex;
    justify-content:space-between;
    color:var(--text-dim);
    font-size:.85rem;
    margin-bottom:14px;
  }
  .qtext{
    font-size:1.08rem;
    line-height:1.5;
    margin:0 0 22px;
  }
  .options{
    display:flex;
    flex-direction:column;
    gap:10px;
  }
  .opt{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 16px;
    border:1px solid var(--border);
    border-radius:9px;
    cursor:pointer;
    background:var(--panel-2);
    transition:border-color .15s ease, background .15s ease;
  }
  .opt:hover{ border-color:#3a4b58; }
  .opt.selected{
    border-color:var(--accent);
    background:rgba(61,220,132,0.09);
  }
  .opt .tag{
    width:26px;height:26px;
    border-radius:50%;
    border:1px solid var(--border);
    display:flex;align-items:center;justify-content:center;
    font-size:.8rem;
    color:var(--text-dim);
    flex-shrink:0;
  }
  .opt.selected .tag{
    background:var(--accent);
    border-color:var(--accent);
    color:#06251a;
  }
  .navrow{
    display:flex;
    justify-content:space-between;
    margin-top:24px;
    gap:10px;
    flex-wrap:wrap;
  }
  button{
    font-family:'Inter',sans-serif;
    font-size:.95rem;
    font-weight:600;
    padding:11px 22px;
    border-radius:8px;
    border:1px solid var(--border);
    background:var(--panel-2);
    color:var(--text);
    cursor:pointer;
  }
  button:hover{ border-color:#3a4b58; }
  button:disabled{ opacity:.4; cursor:not-allowed; }
  button.primary{
    background:var(--accent);
    border-color:var(--accent);
    color:#06251a;
  }
  button.primary:hover{ background:#33c877; }

  .jumpgrid{
    display:grid;
    grid-template-columns:repeat(auto-fill,minmax(36px,1fr));
    gap:8px;
    margin:22px 0 0;
  }
  .jumpgrid button{
    padding:8px 0;
    font-size:.8rem;
    background:var(--panel-2);
  }
  .jumpgrid button.answered{
    background:rgba(61,220,132,0.15);
    border-color:var(--accent-dim);
    color:var(--accent);
  }
  .jumpgrid button.current{
    outline:2px solid var(--accent);
    outline-offset:1px;
  }

  /* results */
  .hidden{ display:none; }
  .resultcard{
    background:var(--panel);
    border:1px solid var(--border);
    border-radius:12px;
    padding:30px 26px;
    text-align:center;
  }
  .scorebig{
    font-family:'Space Grotesk',sans-serif;
    font-size:3rem;
    color:var(--accent);
    margin:6px 0 0;
  }
  .scoresub{ color:var(--text-dim); font-size:.9rem; }
  .statsrow{
    display:flex;
    justify-content:center;
    gap:26px;
    margin:22px 0 4px;
    flex-wrap:wrap;
  }
  .statbox{ text-align:center; }
  .statbox .num{ font-family:'Space Grotesk',sans-serif; font-size:1.5rem; }
  .statbox .lbl{ color:var(--text-dim); font-size:.78rem; margin-top:2px;}
  .statbox.correct .num{ color:var(--accent); }
  .statbox.wrong .num{ color:var(--danger); }

  .topicsection{ margin-top:30px; text-align:left; }
  .topicsection h3{ font-size:1rem; margin-bottom:12px; }
  .topicrow{
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:10px;
    font-size:.88rem;
  }
  .topicrow .tname{ width:170px; flex-shrink:0; color:var(--text-dim); }
  .barbg{
    flex:1;
    height:8px;
    background:var(--border);
    border-radius:4px;
    overflow:hidden;
  }
  .barfill{ height:100%; border-radius:4px; }
  .barfill.strong{ background:var(--accent); }
  .barfill.weak{ background:var(--danger); }
  .barfill.mid{ background:#e0b04d; }
  .topicrow .pct{ width:42px; text-align:right; color:var(--text-dim); }

  .restartbtn{ margin-top:26px; }
</style>
</head>
<body>
<div class="wrap">

  <!-- ===== TEST SCREEN ===== -->
  <div id="testScreen">
    <header>
      <h1>NEET Practice Test <span style="color:var(--text-dim);font-weight:400;">(Demo)</span></h1>
      <div id="timer" class="mono">10:00</div>
    </header>

    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>

    <div class="qcard">
      <div class="qmeta">
        <span id="qNumLabel">Question 1 of 10</span>
        <span id="qTopicLabel">Physics</span>
      </div>
      <p class="qtext" id="qText"></p>
      <div class="options" id="optionsBox"></div>
    </div>

    <div class="navrow">
      <button id="prevBtn">Previous</button>
      <button id="clearBtn">Clear Response</button>
      <button id="nextBtn" class="primary">Save &amp; Next</button>
    </div>

    <div class="jumpgrid" id="jumpGrid"></div>

    <div class="navrow" style="margin-top:26px;">
      <span></span>
      <button id="submitBtn" class="primary">Submit Test</button>
    </div>
    <p style="text-align:center;color:var(--text-dim);font-size:.85rem;margin-top:14px;">
      Jab bhi tayaar ho, upar "Submit Test" button dabakar test khatam karo aur apna score dekho.
    </p>
  </div>

  <!-- ===== RESULT SCREEN ===== -->
  <div id="resultScreen" class="hidden">
    <div class="resultcard">
      <div class="scoresub">Your Score</div>
      <div class="scorebig" id="finalScore">0</div>
      <div class="scoresub" id="scoreOutOf">out of 40</div>

      <div class="statsrow">
        <div class="statbox correct"><div class="num" id="correctCount">0</div><div class="lbl">Correct</div></div>
        <div class="statbox wrong"><div class="num" id="wrongCount">0</div><div class="lbl">Wrong</div></div>
        <div class="statbox"><div class="num" id="skippedCount">0</div><div class="lbl">Skipped</div></div>
      </div>

      <div class="topicsection">
        <h3>Topic-wise Performance</h3>
        <div id="topicList"></div>
      </div>

      <button class="restartbtn primary" onclick="location.reload()">Retake Test</button>
    </div>
  </div>

</div>

<script>
/* ---------- Dummy question data (replace later with real paper) ---------- */
const questions = [
  { topic:"Physics", text:"A body moving with uniform velocity has:", options:["Zero acceleration","Uniform acceleration","Increasing acceleration","Decreasing acceleration"], correct:0 },
  { topic:"Physics", text:"SI unit of electric current is:", options:["Volt","Ohm","Ampere","Watt"], correct:2 },
  { topic:"Chemistry", text:"The pH of a neutral solution at 25°C is:", options:["0","7","14","1"], correct:1 },
  { topic:"Chemistry", text:"Which gas is released during photosynthesis?", options:["Carbon dioxide","Oxygen","Nitrogen","Hydrogen"], correct:1 },
  { topic:"Botany", text:"The powerhouse of the cell is:", options:["Nucleus","Ribosome","Mitochondria","Golgi body"], correct:2 },
  { topic:"Botany", text:"Photosynthesis occurs mainly in:", options:["Roots","Stem","Leaves","Flowers"], correct:2 },
  { topic:"Zoology", text:"The human heart has how many chambers?", options:["2","3","4","5"], correct:2 },
  { topic:"Zoology", text:"Which blood cells help in clotting?", options:["RBC","WBC","Platelets","Plasma"], correct:2 },
  { topic:"Physics", text:"Unit of force in SI system is:", options:["Joule","Newton","Pascal","Watt"], correct:1 },
  { topic:"Chemistry", text:"Atomic number of Hydrogen is:", options:["0","1","2","3"], correct:1 },
];

/* ---------- State ---------- */
const totalQ = questions.length;
const answers = new Array(totalQ).fill(null);
let current = 0;
let secondsLeft = 10 * 60; // 10 min demo timer

/* ---------- Elements ---------- */
const qText = document.getElementById('qText');
const optionsBox = document.getElementById('optionsBox');
const qNumLabel = document.getElementById('qNumLabel');
const qTopicLabel = document.getElementById('qTopicLabel');
const progressFill = document.getElementById('progressFill');
const jumpGrid = document.getElementById('jumpGrid');
const timerEl = document.getElementById('timer');

function renderQuestion(){
  const q = questions[current];
  qText.textContent = (current+1) + ". " + q.text;
  qTopicLabel.textContent = q.topic;
  qNumLabel.textContent = `Question ${current+1} of ${totalQ}`;
  optionsBox.innerHTML = "";
  q.options.forEach((opt, idx)=>{
    const div = document.createElement('div');
    div.className = 'opt' + (answers[current]===idx ? ' selected' : '');
    div.innerHTML = `<span class="tag">${String.fromCharCode(65+idx)}</span><span>${opt}</span>`;
    div.onclick = ()=>{ answers[current]=idx; renderQuestion(); renderJumpGrid(); };
    optionsBox.appendChild(div);
  });
  progressFill.style.width = ((current+1)/totalQ*100) + "%";
  document.getElementById('prevBtn').disabled = current===0;
  renderJumpGrid();
  updateNextBtnLabel();
}

function renderJumpGrid(){
  jumpGrid.innerHTML = "";
  questions.forEach((_, idx)=>{
    const b = document.createElement('button');
    b.textContent = idx+1;
    if(answers[idx]!==null) b.classList.add('answered');
    if(idx===current) b.classList.add('current');
    b.onclick = ()=>{ current=idx; renderQuestion(); };
    jumpGrid.appendChild(b);
  });
}

document.getElementById('prevBtn').onclick = ()=>{ if(current>0){ current--; renderQuestion(); } };
document.getElementById('nextBtn').onclick = ()=>{
  if(current<totalQ-1){ current++; renderQuestion(); }
  else { submitTest(); }
};
document.getElementById('clearBtn').onclick = ()=>{ answers[current]=null; renderQuestion(); };
document.getElementById('submitBtn').onclick = submitTest;

function updateNextBtnLabel(){
  document.getElementById('nextBtn').textContent = (current===totalQ-1) ? "Submit Test" : "Save & Next";
}

/* ---------- Timer ---------- */
function formatTime(s){
  const m = Math.floor(s/60).toString().padStart(2,'0');
  const sec = (s%60).toString().padStart(2,'0');
  return `${m}:${sec}`;
}
const timerInterval = setInterval(()=>{
  secondsLeft--;
  timerEl.textContent = formatTime(secondsLeft);
  if(secondsLeft<=60) timerEl.classList.add('low');
  if(secondsLeft<=0){
    clearInterval(timerInterval);
    submitTest();
  }
}, 1000);
timerEl.textContent = formatTime(secondsLeft);

/* ---------- Submit & Scoring ---------- */
function submitTest(){
  clearInterval(timerInterval);

  let correct=0, wrong=0, skipped=0;
  const topicStats = {};

  questions.forEach((q, idx)=>{
    if(!topicStats[q.topic]) topicStats[q.topic] = {correct:0,total:0};
    topicStats[q.topic].total++;

    if(answers[idx]===null){ skipped++; }
    else if(answers[idx]===q.correct){ correct++; topicStats[q.topic].correct++; }
    else{ wrong++; }
  });

  const score = correct*4 - wrong*1; // NEET marking scheme
  const maxScore = totalQ*4;

  document.getElementById('testScreen').classList.add('hidden');
  document.getElementById('resultScreen').classList.remove('hidden');
  document.getElementById('finalScore').textContent = score;
  document.getElementById('scoreOutOf').textContent = `out of ${maxScore}`;
  document.getElementById('correctCount').textContent = correct;
  document.getElementById('wrongCount').textContent = wrong;
  document.getElementById('skippedCount').textContent = skipped;

  const topicList = document.getElementById('topicList');
  topicList.innerHTML = "";
  Object.keys(topicStats).forEach(topic=>{
    const s = topicStats[topic];
    const pct = Math.round((s.correct/s.total)*100);
    let cls = 'mid';
    if(pct>=70) cls='strong';
    else if(pct<40) cls='weak';

    const row = document.createElement('div');
    row.className = 'topicrow';
    row.innerHTML = `
      <span class="tname">${topic}</span>
      <div class="barbg"><div class="barfill ${cls}" style="width:${pct}%"></div></div>
      <span class="pct">${pct}%</span>
    `;
    topicList.appendChild(row);
  });
}

/* ---------- Init ---------- */
renderQuestion();
</script>
</body>
</html>
