<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>NEET Test</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:wght@600;700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="student-styles.css">
<style>
  .wrap{max-width:820px;margin:0 auto;padding:24px 20px 60px;}
  .center-screen{min-height:75vh;display:flex;align-items:center;justify-content:center;}
  .startcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:36px 30px;max-width:440px;width:100%;text-align:center;}
  .startcard h2{margin:6px 0 6px;font-size:1.4rem;}
  .startcard p{color:var(--ink-dim);font-size:.9rem;margin:0;}
  .infochips{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0 24px;}
  .infochips span{background:var(--bg);border:1px solid var(--line);padding:5px 12px;border-radius:6px;font-size:.8rem;color:var(--ink-dim);}

  header.testbar{display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:12px;}
  header.testbar h1{font-size:1.15rem;margin:0;font-family:'Inter',sans-serif;font-weight:600;}
  #timer{font-family:'Fraunces',serif;font-size:1.15rem;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent-dark);padding:7px 16px;border-radius:8px;}
  #timer.low{background:#FBEAE6;border-color:var(--danger);color:var(--danger);}

  .progress-track{height:5px;background:var(--line);border-radius:3px;overflow:hidden;margin-bottom:24px;}
  .progress-fill{height:100%;background:var(--accent);width:0%;transition:width .25s ease;}

  .qcard{background:var(--surface);border:1px solid var(--line);border-radius:14px;box-shadow:var(--shadow);padding:26px;}
  .qmeta{display:flex;justify-content:space-between;color:var(--ink-dim);font-size:.85rem;margin-bottom:14px;}
  .qmeta span:last-child{background:var(--accent-soft);color:var(--accent-dark);padding:2px 10px;border-radius:6px;font-weight:600;}
  .qtext{font-size:1.04rem;line-height:1.55;margin:0 0 16px;white-space:pre-wrap;color:var(--ink);}
  .qimg{max-width:100%;border-radius:10px;margin-bottom:18px;display:block;border:1px solid var(--line);}
  .options{display:flex;flex-direction:column;gap:10px;}
  .opt{display:flex;align-items:center;gap:12px;padding:13px 16px;border:1px solid var(--line);border-radius:10px;cursor:pointer;background:var(--bg);transition:border-color .15s ease, background .15s ease;}
  .opt:hover{border-color:#c7cfe0;}
  .opt.selected{border-color:var(--accent);background:var(--accent-soft);}
  .opt .tag{width:26px;height:26px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:flex;align-items:center;justify-content:center;font-size:.8rem;color:var(--ink-dim);flex-shrink:0;}
  .opt.selected .tag{background:var(--accent);border-color:var(--accent);color:#fff;}
  .navrow{display:flex;justify-content:space-between;margin-top:22px;gap:10px;flex-wrap:wrap;}
  .jumpgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(36px,1fr));gap:8px;margin:22px 0 0;}
  .jumpgrid button{padding:8px 0;font-size:.8rem;background:var(--surface);border:1px solid var(--line);border-radius:6px;cursor:pointer;color:var(--ink-dim);}
  .jumpgrid button.answered{background:var(--accent-soft);border-color:var(--accent);color:var(--accent-dark);}
  .jumpgrid button.current{outline:2px solid var(--primary);outline-offset:1px;}

  .resultcard{background:var(--surface);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow);padding:34px 28px;text-align:center;}
  .scorebig{font-family:'Fraunces',serif;font-size:3rem;color:var(--accent-dark);margin:6px 0 0;}
  .scoresub{color:var(--ink-dim);font-size:.9rem;}
  .remarkbox{background:var(--gold-soft);border:1px solid var(--gold);color:#7a4e08;border-radius:10px;padding:14px 18px;margin:18px 0;font-size:.92rem;}
  .statsrow{display:flex;justify-content:center;gap:26px;margin:22px 0 4px;flex-wrap:wrap;}
  .statbox .num{font-family:'Fraunces',serif;font-size:1.5rem;}
  .statbox .lbl{color:var(--ink-dim);font-size:.78rem;margin-top:2px;}
  .statbox.correct .num{color:var(--accent-dark);}
  .statbox.wrong .num{color:var(--danger);}
  .topicsection{margin-top:30px;text-align:left;}
  .topicsection h3{font-size:1rem;margin-bottom:12px;font-family:'Inter',sans-serif;font-weight:600;}
  .topicrow{display:flex;align-items:center;gap:12px;margin-bottom:10px;font-size:.85rem;}
  .topicrow .tname{width:180px;flex-shrink:0;color:var(--ink-dim);}
  .barbg{flex:1;height:8px;background:var(--line);border-radius:4px;overflow:hidden;}
  .barfill{height:100%;border-radius:4px;}
  .barfill.strong{background:var(--accent);}
  .barfill.weak{background:var(--danger);}
  .barfill.mid{background:var(--gold);}
  .topicrow .pct{width:42px;text-align:right;color:var(--ink-dim);}
  .btnrow{display:flex;gap:10px;margin-top:26px;}
  .btnrow .btn{flex:1;}
  .loading{text-align:center;color:var(--ink-dim);padding:60px 0;}
</style>
</head>
<body>

<header class="site-header">
  <div class="shell nav">
    <a class="brand" href="index.html">
      <svg width="34" height="34" viewBox="0 0 34 34" fill="none">
        <defs><linearGradient id="lg1" x1="0" y1="0" x2="34" y2="34">
          <stop offset="0" stop-color="#24398B"/><stop offset="1" stop-color="#0F9D82"/>
        </linearGradient></defs>
        <rect width="34" height="34" rx="10" fill="url(#lg1)"/>
        <rect x="15" y="8" width="4" height="18" rx="2" fill="white"/>
        <rect x="8" y="15" width="18" height="4" rx="2" fill="white"/>
      </svg>
      <span class="brand-word">NEET Practice Tests</span>
    </a>
    <nav class="nav-links"><a href="index.html">Mock Tests</a><a href="about.html">About Us</a></nav>
    <div class="nav-auth"></div>
  </div>
</header>

<div class="wrap">

  <div id="loadingScreen" class="loading">Loading test...</div>

  <div id="startScreen" class="center-screen hidden">
    <div class="startcard">
      <p id="hello"></p>
      <h2 id="startTitle">Test</h2>
      <div class="infochips" id="chips"></div>
      <button class="btn btn-primary btn-block" id="startBtn">Start Test</button>
    </div>
  </div>

  <div id="testScreen" class="hidden">
    <header class="testbar">
      <h1 id="testTitleHeader">NEET Test</h1>
      <div id="timer">00:00</div>
    </header>
    <div class="progress-track"><div class="progress-fill" id="progressFill"></div></div>
    <div class="qcard">
      <div class="qmeta">
        <span id="qNumLabel">Question 1</span>
        <span id="qTopicLabel">Topic</span>
      </div>
      <img id="qImage" class="qimg hidden" alt="Question diagram">
      <p class="qtext" id="qText"></p>
      <div class="options" id="optionsBox"></div>
    </div>
    <div class="navrow">
      <button class="btn btn-secondary" id="prevBtn">Previous</button>
      <button class="btn btn-secondary" id="clearBtn">Clear Response</button>
      <button class="btn btn-primary" id="nextBtn">Save &amp; Next</button>
    </div>
    <div class="jumpgrid" id="jumpGrid"></div>
    <div class="navrow" style="margin-top:26px;">
      <span></span>
      <button class="btn btn-primary" id="submitBtn">Submit Test</button>
    </div>
  </div>

  <div id="resultScreen" class="hidden">
    <div class="resultcard">
      <div class="scoresub">Your Score</div>
      <div class="scorebig" id="finalScore">0</div>
      <div class="scoresub" id="scoreOutOf">out of 0</div>
      <div class="remarkbox" id="remarkBox"></div>
      <div class="statsrow">
        <div class="statbox correct"><div class="num" id="correctCount">0</div><div class="lbl">Correct</div></div>
        <div class="statbox wrong"><div class="num" id="wrongCount">0</div><div class="lbl">Wrong</div></div>
        <div class="statbox"><div class="num" id="skippedCount">0</div><div class="lbl">Skipped</div></div>
      </div>
      <div class="topicsection">
        <h3>Topic-wise Performance</h3>
        <div id="topicList"></div>
      </div>
      <div class="btnrow">
        <a class="btn btn-secondary" href="history.html">My Results</a>
        <a class="btn btn-primary" href="index.html">Home</a>
      </div>
    </div>
  </div>
</div>

<script type="module">
  import { db } from './firebase-config.js';
  import { doc, getDoc, collection, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
  import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  const DOMAIN = "@students.neetplatform.app";
  const auth = getAuth();
  const el = id => document.getElementById(id);

  const testId = new URLSearchParams(location.search).get('id');

  let user = null;
  let loadStarted = false;
  let testData = null, questions = [], answers = [], current = 0;
  let secondsLeft = 0, timerInterval = null, submitted = false;

  onAuthStateChanged(auth, u => {
    if(!(u && u.email && u.email.endsWith(DOMAIN))){
      location.replace('login.html?next=' + encodeURIComponent('test.html' + location.search));
      return;
    }
    user = u;
    if(!loadStarted){ loadStarted = true; loadTest(); }
  });

  async function loadTest(){
    if(!testId){ el('loadingScreen').textContent = "Test not found. Please choose a test from the home page."; return; }
    try{
      const snap = await getDoc(doc(db, "tests", testId));
      if(!snap.exists()){ el('loadingScreen').textContent = "This test does not exist."; return; }
      testData = snap.data();
      questions = testData.questions || [];
      answers = new Array(questions.length).fill(null);
      secondsLeft = (testData.timerMin || 60) * 60;

      el('hello').textContent = 'Hi, ' + (user.displayName || 'Student');
      el('startTitle').textContent = testData.title || 'Test';
      el('testTitleHeader').textContent = testData.title || 'Test';
      const chips = el('chips');
      const cm = testData.marksCorrect ?? 4, wm = testData.marksWrong ?? 1;
      [questions.length + ' Questions', (testData.timerMin || 60) + ' min', '+' + cm + ' / -' + wm + ' marking']
        .forEach(t => { const s = document.createElement('span'); s.textContent = t; chips.appendChild(s); });

      el('loadingScreen').classList.add('hidden');
      el('startScreen').classList.remove('hidden');
    } catch(err){
      el('loadingScreen').textContent = "Error: " + err.message;
    }
  }

  el('startBtn').onclick = () => {
    if(!questions.length){ return; }
    el('startScreen').classList.add('hidden');
    el('testScreen').classList.remove('hidden');
    renderQuestion();
    startTimer();
  };

  function renderQuestion(){
    const q = questions[current];
    el('qNumLabel').textContent = `Question ${current+1} of ${questions.length}`;
    el('qTopicLabel').textContent = q.topic || '';
    el('qText').textContent = (current+1) + ". " + q.text;

    const img = el('qImage');
    if(q.image){ img.src = q.image; img.classList.remove('hidden'); }
    else { img.classList.add('hidden'); }

    const box = el('optionsBox');
    box.innerHTML = '';
    q.options.forEach((opt, idx) => {
      const div = document.createElement('div');
      div.className = 'opt' + (answers[current] === idx ? ' selected' : '');
      const tag = document.createElement('span'); tag.className = 'tag'; tag.textContent = String.fromCharCode(65 + idx);
      const txt = document.createElement('span'); txt.textContent = opt;
      div.appendChild(tag); div.appendChild(txt);
      div.onclick = () => { answers[current] = idx; renderQuestion(); };
      box.appendChild(div);
    });

    el('progressFill').style.width = ((current+1) / questions.length * 100) + "%";
    el('prevBtn').disabled = current === 0;
    el('nextBtn').textContent = (current === questions.length - 1) ? "Submit Test" : "Save & Next";
    renderJumpGrid();
  }

  function renderJumpGrid(){
    const grid = el('jumpGrid');
    grid.innerHTML = '';
    questions.forEach((_, idx) => {
      const b = document.createElement('button');
      b.textContent = idx + 1;
      if(answers[idx] !== null) b.classList.add('answered');
      if(idx === current) b.classList.add('current');
      b.onclick = () => { current = idx; renderQuestion(); };
      grid.appendChild(b);
    });
  }

  el('prevBtn').onclick = () => { if(current > 0){ current--; renderQuestion(); } };
  el('nextBtn').onclick = () => {
    if(current < questions.length - 1){ current++; renderQuestion(); }
    else { submitTest(); }
  };
  el('clearBtn').onclick = () => { answers[current] = null; renderQuestion(); };
  el('submitBtn').onclick = submitTest;

  function startTimer(){
    const fmt = s => String(Math.floor(s/60)).padStart(2,'0') + ':' + String(s%60).padStart(2,'0');
    el('timer').textContent = fmt(secondsLeft);
    timerInterval = setInterval(() => {
      secondsLeft--;
      el('timer').textContent = fmt(Math.max(secondsLeft, 0));
      if(secondsLeft <= 60) el('timer').classList.add('low');
      if(secondsLeft <= 0){ clearInterval(timerInterval); submitTest(); }
    }, 1000);
  }

  async function submitTest(){
    if(submitted) return;
    submitted = true;
    clearInterval(timerInterval);

    const marksCorrect = testData.marksCorrect ?? 4;
    const marksWrong = testData.marksWrong ?? 1;
    let correct = 0, wrong = 0, skipped = 0;
    const topicStats = {};

    questions.forEach((q, idx) => {
      const key = q.topic || 'General';
      if(!topicStats[key]) topicStats[key] = {correct:0, total:0};
      topicStats[key].total++;
      if(answers[idx] === null){ skipped++; }
      else if(answers[idx] === q.correct){ correct++; topicStats[key].correct++; }
      else { wrong++; }
    });

    const score = correct * marksCorrect - wrong * marksWrong;
    const maxScore = questions.length * marksCorrect;

    el('testScreen').classList.add('hidden');
    el('resultScreen').classList.remove('hidden');
    el('finalScore').textContent = score;
    el('scoreOutOf').textContent = `out of ${maxScore}`;
    el('correctCount').textContent = correct;
    el('wrongCount').textContent = wrong;
    el('skippedCount').textContent = skipped;

    const matched = (testData.remarks || []).find(r => score >= r.min && score <= r.max);
    if(matched){ el('remarkBox').textContent = matched.text; } else { el('remarkBox').classList.add('hidden'); }

    const list = el('topicList');
    list.innerHTML = '';
    Object.keys(topicStats).forEach(topic => {
      const s = topicStats[topic];
      const pct = Math.round((s.correct / s.total) * 100);
      const cls = pct >= 70 ? 'strong' : (pct < 40 ? 'weak' : 'mid');
      const row = document.createElement('div'); row.className = 'topicrow';
      const n = document.createElement('span'); n.className = 'tname'; n.textContent = topic;
      const bg = document.createElement('div'); bg.className = 'barbg';
      const f = document.createElement('div'); f.className = 'barfill ' + cls; f.style.width = pct + '%';
      bg.appendChild(f);
      const p = document.createElement('span'); p.className = 'pct'; p.textContent = pct + '%';
      row.appendChild(n); row.appendChild(bg); row.appendChild(p);
      list.appendChild(row);
    });

    try{
      await addDoc(collection(db, "attempts"), {
        uid: user.uid,
        name: user.displayName || 'Student',
        mobile: user.email.split('@')[0],
        testId, testTitle: testData.title,
        score, maxScore, correct, wrong, skipped,
        topicStats, submittedAt: serverTimestamp()
      });
    } catch(err){
      console.error("Could not save result:", err.message);
    }
  }
</script>
<script src="mascot.js"></script>
</body>
</html>
